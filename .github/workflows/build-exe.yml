name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover tests -v
      - name: Build with PyInstaller
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name FMTracker --add-data "fmtracker/data;fmtracker/data" FMTracker.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: FMTracker-windows
          path: dist/FMTracker.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FMTracker.exe
