name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Core tests (host)
        run: |
          gcc -O2 -Wall -Isrc tests/test_core.c src/game.c src/demo.c src/cards_data.c -lm -o test_core
          ./test_core
      - name: Build FMTracker.exe
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FMTracker-windows
          path: FMTracker.exe
